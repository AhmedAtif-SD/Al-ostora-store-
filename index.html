<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسطورة - AL OSTORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0b0b; color: #fff; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
        .logo-frame {
            background: linear-gradient(145deg, #181818, #0d0d0d);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-20 relative">

    <!-- نافذة الإشعارات (Toast) -->
    <div id="toast-notification" class="fixed top-5 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 bg-[#141414] border gold-border px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <span class="text-xl">✨</span>
        <span id="toast-message" class="text-xs font-bold gold-text">تمت العملية بنجاح</span>
    </div>

    <!-- شاشة البداية -->
    <div id="hero-section" class="w-full max-w-md min-h-screen flex flex-col justify-between items-center p-6 text-center relative overflow-hidden animate-fade">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-[#d4af37]/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="mt-10 z-10 w-full flex flex-col items-center">
            <div class="w-44 h-44 rounded-2xl border-2 gold-border p-3 logo-frame flex flex-col items-center justify-center mb-6 relative">
                <div class="absolute inset-0 border border-[#d4af37]/30 rounded-xl m-1 pointer-events-none"></div>
                <span class="text-5xl font-black gold-text tracking-widest drop-shadow-md">AS</span>
                <div class="w-24 h-[2px] gold-gradient my-1.5 opacity-80"></div>
                <span class="text-[10px] font-bold tracking-[0.25em] text-amber-200/90">AL OSTORA</span>
            </div>
            <h1 class="text-2xl font-bold tracking-wider gold-text mb-1">متجر الأسطورة</h1>
            <p class="text-xs text-gray-400">أرقى الموديلات والأزياء العصرية</p>
        </div>

        <div class="w-full space-y-4 mb-8 z-10">
            <button onclick="showStore()" class="w-full py-4 rounded-xl gold-gradient text-black font-extrabold text-lg shadow-lg hover:opacity-95 transition transform active:scale-95">
                تسوق الآن ✨
            </button>
            <a href="https://wa.me/249918098924" target="_blank" class="w-full py-4 rounded-xl border gold-border gold-text font-bold text-lg block hover:bg-[#d4af37]/10 transition text-center">
                الإرساليات والتواصل 📞
            </a>
        </div>
    </div>
    <!-- قسم المتجر والمنتجات -->
    <div id="store-section" class="w-full max-w-md min-h-screen p-4 hidden animate-fade">
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <button onclick="showHero()" class="text-gray-400 hover:gold-text text-sm flex items-center gap-1">
                ← الرئيسية
            </button>
            <div class="flex items-center gap-2 bg-[#1a1a1a] px-3 py-1.5 rounded-full border gold-border text-xs">
                <span>📍 💙</span>
                <span id="current-city" class="gold-text font-bold">عطبرة</span>
            </div>
            <button onclick="openCityModal()" class="text-xs text-gray-400 border border-gray-700 px-3 py-1.5 rounded-full hover:gold-border hover:gold-text transition">
                تغيير المدينة
            </button>
        </div>

        <div id="products-container" class="space-y-6">
            <p class="text-center text-gray-500 py-10">جاري تحميل العروض...</p>
        </div>
    </div>

    <!-- زر سلة المشتريات العائم -->
    <div id="floating-cart-btn" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 hidden animate-fade">
        <button onclick="openCartModal()" class="gold-gradient text-black px-6 py-3.5 rounded-2xl font-extrabold text-xs shadow-2xl flex items-center gap-3 border border-amber-200 transform active:scale-95 transition">
            <span>🛒 سلة الطلبات</span>
            <span id="cart-badge-count" class="bg-black text-amber-400 px-2.5 py-1 rounded-full text-[11px] font-black">0</span>
        </button>
    </div>

    <!-- نافذة اختيار المدينة -->
    <div id="city-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-[#121212] w-full max-w-sm rounded-2xl border gold-border p-6 shadow-2xl">
            <h3 class="text-lg font-bold gold-text mb-4 text-center">اختر مدينة التوصيل</h3>
            <div id="cities-list-container" class="space-y-2 mb-4 max-h-60 overflow-y-auto">
                <button onclick="setCity('عطبرة')" class="w-full text-right bg-[#1a1a1a] hover:bg-[#d4af37]/20 border border-gray-800 hover:gold-border p-3 rounded-xl text-xs transition font-bold">📍 عطبرة</button>
                <button onclick="setCity('أم درمان')" class="w-full text-right bg-[#1a1a1a] hover:bg-[#d4af37]/20 border border-gray-800 hover:gold-border p-3 rounded-xl text-xs transition font-bold">📍 أم درمان</button>
                <button onclick="setCity('الخرطوم')" class="w-full text-right bg-[#1a1a1a] hover:bg-[#d4af37]/20 border border-gray-800 hover:gold-border p-3 rounded-xl text-xs transition font-bold">📍 الخرطوم</button>
            </div>
            <button onclick="closeCityModal()" class="w-full py-2 text-xs text-gray-400 hover:text-white">إلغاء</button>
        </div>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div id="product-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
        <div class="bg-[#121212] w-full max-w-md rounded-t-3xl sm:rounded-2xl border gold-border p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-lg font-bold gold-text"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <div class="mb-4">
                <img id="modal-image" src="" alt="" class="w-full h-64 object-cover rounded-xl border border-gray-800 mb-2 shadow-md">
                <div id="modal-gallery" class="flex gap-2 overflow-x-auto pb-1"></div>
            </div>
            
            <div class="flex justify-between items-center mb-2">
                <span id="modal-price" class="text-xl font-extrabold gold-text"></span>
                <span class="text-xs bg-amber-900/30 gold-text px-3 py-1 rounded-full border gold-border">خامه قطن جوده عاليه 🔥💙</span>
            </div>
            
            <p id="modal-desc" class="text-xs text-gray-400 mb-6"></p>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">عدد القطع</label>
                    <div class="flex items-center justify-between bg-[#1a1a1a] border border-gray-800 rounded-xl p-2">
                        <button onclick="updateQty(-1)" class="w-8 h-8 bg-[#2a2a2a] rounded-lg text-lg font-bold flex items-center justify-center">-</button>
                        <span id="qty-value" class="font-bold text-lg">1</span>
                        <button onclick="updateQty(1)" class="w-8 h-8 bg-[#2a2a2a] rounded-lg text-lg font-bold flex items-center justify-center">+</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs gold-text mb-2 font-bold">تحديد المقاس واللون لكل قطعة:</label>
                    <div id="item-options-container" class="space-y-3 bg-[#171717] p-3 rounded-xl border border-gray-800"></div>
                </div>
            </div>

            <button onclick="addToCart()" class="w-full py-4 rounded-xl gold-gradient text-black font-extrabold text-base shadow-lg hover:opacity-95 transition">
                إضافة للسلة 🛒 — <span id="modal-total-price"></span>
            </button>
        </div>
    </div>

    <!-- نافذة سلة المشتريات -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-[#121212] w-full max-w-md rounded-2xl border gold-border p-6 shadow-2xl max-h-[85vh] overflow-y-auto flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                <h3 class="text-lg font-bold gold-text">سلة الطلبات الخاصة بك 🛒</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items-container" class="space-y-3 mb-4 flex-1 overflow-y-auto">
                <p class="text-center text-gray-500 py-6">السلة فارغة حالياً</p>
            </div>

            <div class="border-t border-gray-800 pt-3 space-y-3">
                <div class="flex justify-between items-center text-sm font-bold">
                    <span>إجمالي العروض:</span>
                    <span id="cart-grand-total" class="gold-text">0 ج.س</span>
                </div>
                <button onclick="openCheckoutModal()" id="checkout-btn-cart" class="w-full py-3.5 rounded-xl gold-gradient text-black font-extrabold text-sm shadow-lg hover:opacity-95 transition hidden">
                    متابعة لإتمام الطلب الشامل 🚀
                </button>
            </div>
        </div>
    </div>
    <!-- نافذة إتمام الطلب -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-[#121212] w-full max-w-md rounded-2xl border gold-border p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold gold-text mb-4 text-center">أكمل بيانات الطلب الشامل</h3>
            <div class="space-y-3 mb-6 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">الاسم الكامل *</label>
                    <input type="text" id="cust-name" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="محمد عبد الرحمن">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">رقم الواتساب *</label>
                    <input type="text" id="cust-whatsapp" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="0119562656">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">رقم هاتف احتياطي</label>
                    <input type="text" id="cust-alt-phone" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="0993365989">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">المستلم البديل (اختياري)</label>
                    <input type="text" id="cust-alt-receiver" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="محمد">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">المنطقة / الحي *</label>
                    <input type="text" id="cust-area" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="البنك العقاري">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">طريقة التوصيل</label>
                    <select id="delivery-option" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none">
                        <option value="6000">توصيل داخلي - 6,000 ج.س</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="submitFinalOrder()" class="w-full py-3.5 rounded-xl gold-gradient text-black font-extrabold text-sm shadow-lg hover:opacity-95 transition">
                    تأكيد وإرسال الطلب الشامل للواتساب 🚀
                </button>
                <button onclick="closeCheckoutModal()" class="px-4 py-3.5 rounded-xl border border-gray-700 text-xs text-gray-400 hover:text-white">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oahyrrymmaazzskpfqvl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9haHlycnltbWFhenpza3BmcXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzg2NTIsImV4cCI6MjEwODk1NDY1Mn0.qUXnhCROVGpx2P-XDFM2nC5xxtKtx86GxW2eV9Ipd3E';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch(e) {}

        const OWNER_WHATSAPP = '249918098924';
        let loadedProducts = [];
        let selectedProduct = null;
        let quantity = 1;
        let cart = []; // مصفوفة سلة المشتريات

        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').innerText = msg;
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translateY(-80px)';
                toast.style.opacity = '0';
            }, 3000);
        }

        function showStore() {
            document.getElementById('hero-section').classList.add('hidden');
            document.getElementById('store-section').classList.remove('hidden');
            loadProducts();
        }

        function showHero() {
            document.getElementById('store-section').classList.add('hidden');
            document.getElementById('hero-section').classList.remove('hidden');
        }

        async function openCityModal() {
            document.getElementById('city-modal').classList.remove('hidden');
            await loadCitiesListModal();
        }

        function closeCityModal() {
            document.getElementById('city-modal').classList.add('hidden');
        }

        async function loadCitiesListModal() {
            const container = document.getElementById('cities-list-container');
            let cities = ['عطبرة', 'أم درمان', 'الخرطوم'];
            if(supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('cities').select('*');
                    if(data && data.length > 0) cities = data.map(c => c.name);
                } catch(e) {}
            }
            container.innerHTML = '';
            cities.forEach(cityName => {
                const btn = document.createElement('button');
                btn.onclick = () => setCity(cityName);
                btn.className = 'w-full text-right bg-[#1a1a1a] hover:bg-[#d4af37]/20 border border-gray-800 hover:gold-border p-3 rounded-xl text-xs transition font-bold';
                btn.innerText = `📍 ${cityName}`;
                container.appendChild(btn);
            });
        }

        function setCity(cityName) {
            document.getElementById('current-city').innerText = cityName;
            closeCityModal();
            loadProducts();
        }

        async function loadProducts() {
            const currentCity = document.getElementById('current-city').innerText.trim();
            const container = document.getElementById('products-container');
            container.innerHTML = '<p class="text-center text-gray-500 py-10">جاري تحميل العروض...</p>';

            if (!supabaseClient) {
                container.innerHTML = '<p class="text-center text-red-500 py-10">خطأ في الاتصال بقاعدة البيانات</p>';
                return;
            }

            try {
                const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
                
                if (error || !data) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-10">لا توجد عروض مضافة حالياً.</p>';
                    return;
                }

                loadedProducts = data.filter(p => {
                    const pCity = p.city ? p.city.trim() : 'الكل';
                    return pCity === 'الكل' || pCity === currentCity;
                });

                if (loadedProducts.length === 0) {
                    container.innerHTML = `<p class="text-center text-gray-500 py-10">لا توجد عروض في مدينة ${currentCity} حالياً.</p>`;
                    return;
                }

                container.innerHTML = '';
                loadedProducts.forEach((product, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-[#141414] border border-gray-800 rounded-2xl overflow-hidden shadow-xl mb-6 animate-fade';
                    
                    let images = [product.image_url];
                    if (product.images) {
                        try {
                            const parsed = JSON.parse(product.images);
                            if (Array.isArray(parsed) && parsed.length > 0) images = parsed;
                        } catch(e) {}
                    }

                    card.innerHTML = `
                        <div class="grid grid-cols-2 gap-1 bg-[#1a1a1a] p-1">
                            <img src="${images[0] || 'https://via.placeholder.com/300'}" class="w-full h-44 object-cover rounded-lg" alt="${product.title}">
                            <img src="${images[1] || images[0] || 'https://via.placeholder.com/300'}" class="w-full h-44 object-cover rounded-lg" alt="${product.title}">
                        </div>
                        <div class="p-4 text-center">
                            <h2 class="text-base font-bold mb-1">${product.title} 💙😍</h2>
                            <p class="gold-text font-extrabold text-lg mb-2">${product.price.toLocaleString()} ج.س</p>
                            <p class="text-xs text-gray-400 mb-4">اضغط لعرض التفاصيل واختيار المقاسات والألوان</p>
                            <button onclick="openProductModal(${index})" class="w-full py-2.5 rounded-xl border gold-border gold-text text-sm font-bold hover:bg-[#d4af37]/10 transition">
                                عرض التفاصيل
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch(err) {
                container.innerHTML = '<p class="text-center text-red-500 py-10">حدث خطأ أثناء تحميل المنتجات</p>';
            }
        }

        function openProductModal(index) {
            selectedProduct = loadedProducts[index];
            quantity = 1;
            document.getElementById('qty-value').innerText = quantity;
            document.getElementById('modal-title').innerText = selectedProduct.title;
            
            let images = [selectedProduct.image_url];
            if (selectedProduct.images) {
                try {
                    const parsed = JSON.parse(selectedProduct.images);
                    if (Array.isArray(parsed) && parsed.length > 0) images = parsed;
                } catch(e) {}
            }

            document.getElementById('modal-image').src = images[0];
            
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = '';
            if (images.length > 1) {
                images.forEach((imgSrc) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgSrc;
                    thumb.className = 'w-16 h-16 object-cover rounded-lg border border-gray-700 cursor-pointer hover:border-[#d4af37]';
                    thumb.onclick = () => { document.getElementById('modal-image').src = imgSrc; };
                    gallery.appendChild(thumb);
                });
            }

            document.getElementById('modal-price').innerText = selectedProduct.price.toLocaleString() + ' ج.س';
            document.getElementById('modal-desc').innerText = selectedProduct.description || 'خامه قطن جوده عاليه 🔥💙';

            renderItemOptions();
            updateTotalPrice();
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function renderItemOptions() {
            const container = document.getElementById('item-options-container');
            container.innerHTML = '';
            const colorsList = selectedProduct.colors ? selectedProduct.colors.split(/[,،]/) : ['أسود', 'كبدي', 'أزرق'];
            
            let sizesList = ['S', 'M', 'L', 'XL', 'XXL'];
            if (selectedProduct.sizes) {
                sizesList = selectedProduct.sizes.split(/[,،]/).map(s => s.trim());
            }

            for (let i = 1; i <= quantity; i++) {
                const div = document.createElement('div');
                div.className = 'bg-[#121212] p-2.5 rounded-xl border border-gray-800 space-y-2';
                div.innerHTML = `
                    <div class="text-[11px] gold-text font-bold">القطعة #${i}</div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-0.5">المقاس</label>
                            <select class="item-size-select w-full bg-[#1a1a1a] border border-gray-700 rounded-lg p-1.5 text-xs gold-border focus:outline-none">
                                ${sizesList.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-400 mb-0.5">اللون</label>
                            <select class="item-color-select w-full bg-[#1a1a1a] border border-gray-700 rounded-lg p-1.5 text-xs gold-border focus:outline-none">
                                ${colorsList.map((c, idx) => `<option value="${c.trim()}" ${idx === 0 ? 'selected' : ''}>${c.trim()}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function updateQty(change) {
            quantity += change;
            if(quantity < 1) quantity = 1;
            document.getElementById('qty-value').innerText = quantity;
            renderItemOptions();
            updateTotalPrice();
        }

        function updateTotalPrice() {
            if(selectedProduct) {
                const total = selectedProduct.price * quantity;
                document.getElementById('modal-total-price').innerText = total.toLocaleString() + ' ج.س';
            }
        }

        // إضافة المنتج للسلة
        function addToCart() {
            const sizeSelects = document.querySelectorAll('.item-size-select');
            const colorSelects = document.querySelectorAll('.item-color-select');
            
            const itemDetails = [];
            for(let i = 0; i < quantity; i++) {
                itemDetails.push(`مقاس (${sizeSelects[i].value}) - لون (${colorSelects[i].value})`);
            }

            let images = [selectedProduct.image_url];
            if (selectedProduct.images) {
                try {
                    const parsed = JSON.parse(selectedProduct.images);
                    if (Array.isArray(parsed) && parsed.length > 0) images = parsed;
                } catch(e) {}
            }

            const cartItem = {
                id: Date.now(),
                title: selectedProduct.title,
                price: selectedProduct.price,
                quantity: quantity,
                details: itemDetails,
                image_url: images[0],
                total: selectedProduct.price * quantity
            };

            cart.push(cartItem);
            updateCartUI();
            closeModal();
            showToast('تمت إضافة المنتج إلى السلة بنجاح 🛒');
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge-count');
            const floatBtn = document.getElementById('floating-cart-btn');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            badge.innerText = totalItems;
            if(totalItems > 0) {
                floatBtn.classList.remove('hidden');
            } else {
                floatBtn.classList.add('hidden');
            }
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const checkoutBtn = document.getElementById('checkout-btn-cart');
            const grandTotalElem = document.getElementById('cart-grand-total');

            if(cart.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-6">السلة فارغة حالياً</p>';
                checkoutBtn.classList.add('hidden');
                grandTotalElem.innerText = '0 ج.س';
                return;
            }

            container.innerHTML = '';
            let grandTotal = 0;

            cart.forEach((item, index) => {
                grandTotal += item.total;
                const div = document.createElement('div');
                div.className = 'bg-[#1a1a1a] p-3 rounded-xl border border-gray-800 flex items-center justify-between gap-3 text-xs';
                div.innerHTML = `
                    <div class="flex items-center gap-2">
                        <img src="${item.image_url}" class="w-12 h-12 object-cover rounded-lg border border-gray-700">
                        <div>
                            <p class="font-bold text-sm">${item.title} (كمية: ${item.quantity})</p>
                            <p class="text-[10px] text-gray-400 whitespace-pre-line">${item.details.join(', ')}</p>
                            <p class="gold-text font-bold mt-1">${item.total.toLocaleString()} ج.س</p>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-300 font-bold px-2 py-1 bg-red-950/30 border border-red-900 rounded-lg">حذف</button>
                `;
                container.appendChild(div);
            });

            grandTotalElem.innerText = grandTotal.toLocaleString() + ' ج.س';
            checkoutBtn.classList.remove('hidden');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            renderCartItems();
            if(cart.length === 0) closeCartModal();
        }

        async function openCheckoutModal() {
            closeCartModal();
            await loadDeliveryOptionsInCheckout();
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        async function loadDeliveryOptionsInCheckout() {
            const select = document.getElementById('delivery-option');
            const currentCity = document.getElementById('current-city').innerText.trim();
            if(!supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('delivery_zones').select('*');
                if(data && data.length > 0) {
                    const cityZones = data.filter(z => {
                        const zCity = z.city ? z.city.trim() : 'عطبرة';
                        return zCity === 'الكل' || zCity === currentCity;
                    });
                    if(cityZones.length > 0) {
                        select.innerHTML = '';
                        cityZones.forEach(zone => {
                            const opt = document.createElement('option');
                            opt.value = zone.price;
                            opt.innerText = `${zone.zone_name} (${zone.price.toLocaleString()} ج.س)`;
                            select.appendChild(opt);
                        });
                        return;
                    }
                }
                select.innerHTML = '<option value="6000">توصيل داخلي - 6,000 ج.س</option>';
            } catch(e) {
                select.innerHTML = '<option value="6000">توصيل داخلي - 6,000 ج.س</option>';
            }
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        async function submitFinalOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const whatsapp = document.getElementById('cust-whatsapp').value.trim();
            const altPhone = document.getElementById('cust-alt-phone').value.trim();
            const altReceiver = document.getElementById('cust-alt-receiver').value.trim();
            const area = document.getElementById('cust-area').value.trim();
            const deliverySelect = document.getElementById('delivery-option');
            const deliveryPrice = parseFloat(deliverySelect.value || 0);
            const deliveryName = deliverySelect.options[deliverySelect.selectedIndex].text;
            const city = document.getElementById('current-city').innerText;

            if(!name || !whatsapp || !area) {
                showToast('الرجاء إكمال الحقول الإلزامية');
                return;
            }

            let cartSubtotal = 0;
            const itemsSummary = [];

            cart.forEach((item, idx) => {
                cartSubtotal += item.total;
                itemsSummary.push(`▫️ المنتج (${idx+1}): ${item.title} (الكمية: ${item.quantity})\n   التفاصيل: ${item.details.join(' | ')}\n   السعر: ${item.total.toLocaleString()} ج.س`);
            });

            const grandTotal = cartSubtotal + deliveryPrice;

            const orderData = {
                product_title: `طلب سلة (${cart.length} منتجات)`,
                quantity: cart.reduce((s, i) => s + i.quantity, 0),
                size: 'متعدد',
                color: itemsSummary.join('\n\n'),
                total_price: grandTotal,
                city: city,
                customer_name: name,
                customer_whatsapp: whatsapp,
                alternative_phone: altPhone || 'لا يوجد',
                alternative_receiver: altReceiver || 'لا يوجد',
                area: area,
                delivery_price: deliveryPrice,
                status: 'جديدة',
                image_url: cart[0].image_url
            };

            try {
                if(supabaseClient) {
                    await supabaseClient.from('orders').insert([orderData]);
                }
            } catch(err) {}

            const message = `🛍️ *طلب جديد متكامل - متجر الأسطورة*\n\n` +
                            `📦 محتويات السلة:\n\n${itemsSummary.join('\n\n')}\n\n` +
                            `--------------------\n` +
                            `👤 الاسم: ${name}\n` +
                            `📞 واتساب: ${whatsapp}\n` +
                            `📱 احتياطي: ${altPhone || 'لا يوجد'}\n` +
                            `👤 المستلم البديل: ${altReceiver || 'لا يوجد'}\n` +
                            `📍 المدينة والمنطقة: ${city} - ${area}\n` +
                            `🚚 التوصيل: ${deliveryName}\n` +
                            `💰 إجمالي العروض: ${cartSubtotal.toLocaleString()} ج.س\n` +
                            `💎 الإجمالي الكلي: ${grandTotal.toLocaleString()} ج.س`;

            const whatsappUrl = `https://wa.me/${OWNER_WHATSAPP}?text=` + encodeURIComponent(message);
            
            showToast('تم إرسال طلبيتك بنجاح! جاري تحويلك للواتساب..');
            closeCheckoutModal();
            cart = [];
            updateCartUI();
            setTimeout(() => { window.location.href = whatsappUrl; }, 1200);
        }
    </script>
</body>
</html>
