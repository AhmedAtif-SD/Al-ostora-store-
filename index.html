<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسطورة - AL OSTORA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0b0b; color: #fff; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-12">

    <!-- شاشة البداية / الواجهة الرئيسية -->
    <div id="hero-section" class="w-full max-w-md min-h-screen flex flex-col justify-between items-center p-6 text-center relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-[#d4af37]/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="mt-12 z-10 w-full flex flex-col items-center">
            <!-- الشعار الجديد AL OSTORA -->
            <div class="w-44 h-44 rounded-2xl border-2 gold-border p-2 bg-[#141414] shadow-2xl flex flex-col items-center justify-center mb-6">
                <span class="text-5xl font-black gold-text tracking-wider">AS</span>
                <span class="text-xs font-bold tracking-widest mt-2 text-amber-100/80">AL OSTORA</span>
            </div>
            <h1 class="text-2xl font-bold tracking-wider gold-text mb-2">متجر الأسطورة</h1>
            <p class="text-xs text-gray-400">أرقى الموديلات والأزياء العصرية</p>
        </div>

        <div class="w-full space-y-4 mb-8 z-10">
            <button onclick="showStore()" class="w-full py-4 rounded-xl gold-gradient text-black font-extrabold text-lg shadow-lg hover:opacity-90 transition">
                تسوق الآن
            </button>
            <a href="https://wa.me/249127776664" target="_blank" class="w-full py-4 rounded-xl border gold-border gold-text font-bold text-lg block hover:bg-[#d4af37]/10 transition text-center">
                الإرساليات والتواصل
            </a>
        </div>
    </div>

    <!-- قسم المتجر والمنتجات -->
    <div id="store-section" class="w-full max-w-md min-h-screen p-4 hidden">
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <button onclick="showHero()" class="text-gray-400 hover:gold-text text-sm flex items-center gap-1">
                ← الرئيسية
            </button>
            <div class="flex items-center gap-2 bg-[#1a1a1a] px-3 py-1.5 rounded-full border gold-border text-xs">
                <span>📍 💙</span>
                <span id="current-city" class="gold-text font-bold">عطبرة</span>
            </div>
            <button onclick="openCityModal()" class="text-xs text-gray-400 border border-gray-700 px-3 py-1.5 rounded-full hover:gold-border hover:gold-text transition">
                تغيير المدينة
            </button>
        </div>

        <div id="products-container" class="space-y-6">
            <p class="text-center text-gray-500 py-10">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- نافذة اختيار المدينة -->
    <div id="city-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-[#121212] w-full max-w-sm rounded-2xl border gold-border p-6 shadow-2xl">
            <h3 class="text-lg font-bold gold-text mb-4 text-center">اختر مدينة التوصيل</h3>
            <div id="cities-list" class="space-y-2 mb-4 max-h-60 overflow-y-auto"></div>
            <div class="border-t border-gray-800 pt-3">
                <input type="text" id="custom-city-input" placeholder="أو اكتب مدينة أخرى..." class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs mb-3 focus:outline-none gold-border">
                <button onclick="selectCustomCity()" class="w-full py-2.5 rounded-xl gold-gradient text-black font-bold text-xs">تأكيد المدينة</button>
            </div>
            <button onclick="closeCityModal()" class="w-full mt-3 py-2 text-xs text-gray-400 hover:text-white">إلغاء</button>
        </div>
    </div>

    <!-- نافذة تفاصيل المنتج واختيار المقاس/اللون -->
    <div id="product-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
        <div class="bg-[#121212] w-full max-w-md rounded-t-3xl sm:rounded-2xl border gold-border p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-lg font-bold gold-text"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <img id="modal-image" src="" alt="" class="w-full h-64 object-cover rounded-xl mb-4 border border-gray-800">
            
            <div class="flex justify-between items-center mb-2">
                <span id="modal-price" class="text-xl font-extrabold gold-text"></span>
                <span class="text-xs bg-amber-900/30 gold-text px-3 py-1 rounded-full border gold-border">خامه قطن جوده عاليه 🔥💙</span>
            </div>
            
            <p id="modal-desc" class="text-xs text-gray-400 mb-6"></p>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">عدد القطع</label>
                    <div class="flex items-center justify-between bg-[#1a1a1a] border border-gray-800 rounded-xl p-2">
                        <button onclick="updateQty(-1)" class="w-8 h-8 bg-[#2a2a2a] rounded-lg text-lg font-bold flex items-center justify-center">-</button>
                        <span id="qty-value" class="font-bold text-lg">1</span>
                        <button onclick="updateQty(1)" class="w-8 h-8 bg-[#2a2a2a] rounded-lg text-lg font-bold flex items-center justify-center">+</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">المقاس</label>
                        <select id="size-select" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none gold-border">
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L" selected>L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">اللون</label>
                        <select id="color-select" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none gold-border">
                            <option value="كبدي" selected>كبدي</option>
                            <option value="أسود">أسود</option>
                            <option value="أخضر">أخضر</option>
                            <option value="أزرق">أزرق</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="openCheckoutModal()" class="w-full py-4 rounded-xl gold-gradient text-black font-extrabold text-base shadow-lg hover:opacity-95 transition">
                أضف للطلب — <span id="modal-total-price"></span>
            </button>
        </div>
    </div>

    <!-- نافذة إتمام الطلب الشاملة (الاسم، الواتساب، المنطقة...) -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div class="bg-[#121212] w-full max-w-md rounded-2xl border gold-border p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold gold-text mb-4 text-center">أكمل بيانات الطلب</h3>
            <div class="space-y-3 mb-6 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">الاسم الكامل *</label>
                    <input type="text" id="cust-name" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="محمد عبد الرحمن">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">رقم الواتساب *</label>
                    <input type="text" id="cust-whatsapp" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="0119562656">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">رقم هاتف احتياطي</label>
                    <input type="text" id="cust-alt-phone" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="0993365989">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">المستلم البديل (اختياري)</label>
                    <input type="text" id="cust-alt-receiver" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="محمد">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">المنطقة / الحي *</label>
                    <input type="text" id="cust-area" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none" placeholder="البنك العقاري">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">تكلفة وطريقة التوصيل</label>
                    <select id="delivery-option" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-xs gold-border focus:outline-none">
                        <option value="6000">داخل المدينة - 6,000 ج.س</option>
                        <option value="10000">شحن ولائية - 10,000 ج.س</option>
                        <option value="0">استلام مباشر - 0 ج.س</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="submitFinalOrder()" class="w-full py-3.5 rounded-xl gold-gradient text-black font-extrabold text-sm shadow-lg hover:opacity-95 transition">
                    تأكيد وإرسال الطلب 🚀
                </button>
                <button onclick="closeCheckoutModal()" class="px-4 py-3.5 rounded-xl border border-gray-700 text-xs text-gray-400 hover:text-white">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oahyrrymmaazzskpfqvl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9haHlycnltbWFhenpza3BmcXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzg2NTIsImV4cCI6MjEwODk1NDY1Mn0.qUXnhCROVGpx2P-XDFM2nC5xxtKtx86GxW2eV9Ipd3E';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const OWNER_WHATSAPP = '249127776664';

        const cities = ['عطبرة', 'الخرطوم', 'أمدرمان', 'بحري', 'مدني', 'بورتسودان', 'كسلا', 'الأبيض', 'كوستي'];

        let selectedProduct = null;
        let quantity = 1;

        function showStore() {
            document.getElementById('hero-section').classList.add('hidden');
            document.getElementById('store-section').classList.remove('hidden');
            loadProducts();
        }

        function showHero() {
            document.getElementById('store-section').classList.add('hidden');
            document.getElementById('hero-section').classList.remove('hidden');
        }

        function openCityModal() {
            const listContainer = document.getElementById('cities-list');
            listContainer.innerHTML = '';
            cities.forEach(city => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-right bg-[#1a1a1a] hover:bg-[#d4af37]/20 border border-gray-800 hover:gold-border p-2.5 rounded-xl text-xs transition font-semibold';
                btn.innerText = '📍 ' + city;
                btn.onclick = () => {
                    document.getElementById('current-city').innerText = city;
                    closeCityModal();
                };
                listContainer.appendChild(btn);
            });
            document.getElementById('city-modal').classList.remove('hidden');
        }

        function closeCityModal() { document.getElementById('city-modal').classList.add('hidden'); }

        function selectCustomCity() {
            const custom = document.getElementById('custom-city-input').value.trim();
            if(custom) {
                document.getElementById('current-city').innerText = custom;
                closeCityModal();
            } else {
                alert('الرجاء إدخال اسم المدينة');
            }
        }

        async function loadProducts() {
            const container = document.getElementById('products-container');
            const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
            
            if (error || !data || data.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">لا توجد منتجات مضافة حالياً. قم بإضافتها من لوحة التحكم.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-[#141414] border border-gray-800 rounded-2xl overflow-hidden shadow-xl mb-6';
                card.innerHTML = `
                    <div class="grid grid-cols-2 gap-1 bg-[#1a1a1a] p-1">
                        <img src="${product.image_url || 'https://via.placeholder.com/300'}" class="w-full h-44 object-cover rounded-lg" alt="${product.title}">
                        <img src="${product.image_url || 'https://via.placeholder.com/300'}" class="w-full h-44 object-cover rounded-lg" alt="${product.title}">
                    </div>
                    <div class="p-4 text-center">
                        <h2 class="text-base font-bold mb-1">${product.title} 💙😍</h2>
                        <p class="gold-text font-extrabold text-lg mb-2">${product.price.toLocaleString()} ج.س</p>
                        <p class="text-xs text-gray-400 mb-4">اضغط لعرض التفاصيل واختيار اللون والمقاس</p>
                        <button onclick='openProductModal(${JSON.stringify(product)})' class="w-full py-2.5 rounded-xl border gold-border gold-text text-sm font-bold hover:bg-[#d4af37]/10 transition">
                            عرض التفاصيل
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openProductModal(product) {
            selectedProduct = product;
            quantity = 1;
            document.getElementById('qty-value').innerText = quantity;
            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('modal-image').src = product.image_url;
            document.getElementById('modal-price').innerText = product.price.toLocaleString() + ' ج.س';
            document.getElementById('modal-desc').innerText = product.description || 'خامه قطن جوده عاليه 🔥💙';
            updateTotalPrice();
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function updateQty(change) {
            quantity += change;
            if(quantity < 1) quantity = 1;
            document.getElementById('qty-value').innerText = quantity;
            updateTotalPrice();
        }

        function updateTotalPrice() {
            if(selectedProduct) {
                const total = selectedProduct.price * quantity;
                document.getElementById('modal-total-price').innerText = total.toLocaleString() + ' ج.س';
            }
        }

        function openCheckoutModal() {
            closeModal();
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        async function submitFinalOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const whatsapp = document.getElementById('cust-whatsapp').value.trim();
            const altPhone = document.getElementById('cust-alt-phone').value.trim();
            const altReceiver = document.getElementById('cust-alt-receiver').value.trim();
            const area = document.getElementById('cust-area').value.trim();
            const deliveryPrice = parseFloat(document.getElementById('delivery-option').value);
            const city = document.getElementById('current-city').innerText;

            if(!name || !whatsapp || !area) {
                alert('الرجاء إكمال الحقول الإلزامية (الاسم، الواتساب، والمنطقة)');
                return;
            }

            const size = document.getElementById('size-select').value;
            const color = document.getElementById('color-select').value;
            const productTotal = selectedProduct.price * quantity;
            const grandTotal = productTotal + deliveryPrice;

            const orderData = {
                product_title: selectedProduct.title + ` x${quantity}`,
                quantity: quantity,
                size: size,
                color: color,
                total_price: grandTotal,
                city: city,
                customer_name: name,
                customer_whatsapp: whatsapp,
                alternative_phone: altPhone || 'لا يوجد',
                alternative_receiver: altReceiver || 'لا يوجد',
                area: area,
                delivery_price: deliveryPrice,
                status: 'جديدة'
            };

            // إرسال الطلب لقاعدة البيانات
            const { error } = await supabaseClient.from('orders').insert([orderData]);

            if(error) {
                alert("حدث خطأ أثناء إرسال الطلب: " + error.message);
            } else {
                // إرسال رسالة واتساب لصاحب المحل تلقائياً
                const message = `🛍️ *طلب جديد - متجر الأسطورة*\n\n` +
                                `📦 المنتج: ${selectedProduct.title} (كمية: ${quantity})\n` +
                                `🎨 المقاس: ${size} | اللون: ${color}\n` +
                                `👤 الاسم: ${name}\n` +
                                `📞 واتساب: ${whatsapp}\n` +
                                `📱 احتياطي: ${altPhone || 'لا يوجد'}\n` +
                                `👤 المستلم البديل: ${altReceiver || 'لا يوجد'}\n` +
                                `📍 المدينة والمنطقة: ${city} - ${area}\n` +
                                `🚚 التوصيل: ${deliveryPrice.toLocaleString()} ج.س\n` +
                                `💰 الإجمالي: ${grandTotal.toLocaleString()} ج.س`;

                const whatsappUrl = `https://wa.me/${OWNER_WHATSAPP}?text=${encodeURIComponent(message)}`;
                
                alert("تم إرسال طلبك بنجاح وحفظه في النظام! سيتم تحويلك الآن لمراسلة المتجر عبر الواتساب.");
                closeCheckoutModal();
                window.location.href = whatsappUrl;
