<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الأسطورة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0b0b; color: #fff; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="w-full max-w-sm bg-[#141414] border gold-border rounded-2xl p-6 shadow-2xl text-center mt-20">
        <h1 class="text-xl font-bold gold-text mb-2">لوحة تحكم المالك</h1>
        <p class="text-xs text-gray-400 mb-6">الرجاء إدخال كلمة المرور للمتابعة</p>
        <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-sm mb-4 text-center gold-border focus:outline-none">
        <button onclick="checkPassword()" class="w-full py-3 rounded-xl gold-gradient text-black font-extrabold text-sm shadow-lg mb-3">تسجيل الدخول</button>
        <a href="index.html" class="text-xs text-gray-500 hover:gold-text underline">← العودة للمتجر الرئيسي</a>
    </div>

    <!-- المحتوى الرئيسي للوحة التحكم -->
    <div id="admin-content" class="w-full max-w-md hidden">
        <!-- الشريط العُلوي -->
        <div class="flex justify-between items-center mb-4 bg-[#141414] p-3 rounded-2xl border gold-border">
            <h1 class="text-base font-bold gold-text">لوحة التحكم</h1>
            <div class="flex items-center gap-2">
                <a href="index.html" class="bg-[#222] px-3 py-1.5 rounded-xl text-xs border border-gray-700 font-bold hover:gold-text">المتجر</a>
                <button onclick="logout()" class="bg-red-950/40 text-red-400 px-3 py-1.5 rounded-xl text-xs border border-red-900 font-bold">خروج</button>
            </div>
        </div>

        <!-- التبويبات الرئيسية -->
        <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="switchTab('orders')" id="tab-orders-btn" class="py-3 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg text-center">الطلبات <span id="orders-count-badge" class="bg-black text-white px-1.5 py-0.5 rounded-full text-[10px]">0</span></button>
            <button onclick="switchTab('delivery')" id="tab-delivery-btn" class="py-3 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-xs text-center">التوصيل</button>
            <button onclick="switchTab('offers')" id="tab-offers-btn" class="py-3 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-xs text-center">العروض</button>
        </div>

        <!-- قسم الطلبات -->
        <div id="tab-orders" class="space-y-4">
            <div class="flex gap-1 overflow-x-auto pb-2">
                <button onclick="filterOrders('الكل')" class="filter-btn bg-[#222] px-3 py-1.5 rounded-xl text-xs border gold-border font-bold">الكل</button>
                <button onclick="filterOrders('جديدة')" class="filter-btn bg-[#141414] px-3 py-1.5 rounded-xl text-xs border border-gray-800 text-gray-400">جديدة</button>
                <button onclick="filterOrders('مسلمة')" class="filter-btn bg-[#141414] px-3 py-1.5 rounded-xl text-xs border border-gray-800 text-gray-400">مسلمة</button>
                <button onclick="loadOrders()" class="bg-[#141414] px-3 py-1.5 rounded-xl text-xs border border-gray-800 text-gray-400 mr-auto">تحديث</button>
            </div>

            <div class="flex justify-between items-center text-xs">
                <button onclick="deleteDeliveredOrders()" class="text-red-400 hover:underline">حذف المسلمة</button>
                <button onclick="deleteAllOrders()" class="text-red-500 hover:underline">إفراغ كل الطلبات</button>
            </div>

            <div id="orders-list" class="space-y-4">
                <p class="text-center text-gray-500 py-10 text-xs">جاري تحميل الطلبات...</p>
            </div>
        </div>

        <!-- قسم التوصيل (إدارة وتغيير الأسعار والمناطق) -->
        <div id="tab-delivery" class="bg-[#141414] border gold-border rounded-2xl p-4 hidden space-y-4 text-xs">
            <h3 class="font-bold gold-text text-sm mb-1">إدارة أسعار وطرق التوصيل</h3>
            <p class="text-gray-400 mb-3">أضف أو احذف خيارات التوصيل التي تظهر للعملاء عند إتمام الطلب:</p>
            
            <form onsubmit="addDeliveryZone(event)" class="space-y-2.5 bg-[#1a1a1a] p-3 rounded-xl border border-gray-800 mb-4">
                <div>
                    <label class="block text-gray-400 mb-1">اسم المنطقة / خيار التوصيل</label>
                    <input type="text" id="zone-name" required class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="مثال: توصيل خاص - عطبرة">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">السعر (ج.س)</label>
                    <input type="number" id="zone-price" required class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="6000">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg">إضافة خيار التوصيل</button>
            </form>

            <div id="delivery-zones-list" class="space-y-2">
                <p class="text-center text-gray-500 py-4">جاري التحميل...</p>
            </div>
        </div>

        <!-- قسم العروض وإضافة المنتجات (مع اختيار المدينة المخصصة) -->
        <div id="tab-offers" class="bg-[#141414] border gold-border rounded-2xl p-4 hidden space-y-4 text-xs">
            <h3 class="font-bold gold-text text-sm mb-2">إضافة عرض / منتج جديد لكل مدينة</h3>
            <form id="product-form" onsubmit="addProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-gray-400 mb-1">اسم العرض / المنتج</label>
                    <input type="text" id="title" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="مثال: طقم رياضي فخم">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">السعر (ج.س)</label>
                    <input type="number" id="price" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="60000">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">المدينة المخصصة للعرض</label>
                    <select id="product-city" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none">
                        <option value="الكل">كل المدن (عام)</option>
                        <option value="عطبرة">عطبرة فقط</option>
                        <option value="الخرطوم">الخرطوم فقط</option>
                        <option value="أمدرمان">أمدرمان فقط</option>
                        <option value="بحري">بحري فقط</option>
                        <option value="مدني">مدني فقط</option>
                        <option value="بورتسودان">بورتسودان فقط</option>
                        <option value="كسلا">كسلا فقط</option>
                        <option value="الأبيض">الأبيض فقط</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">رابط صورة العرض (URL)</label>
                    <input type="url" id="image_url" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="https://example.com/image.jpg">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">وصف العرض</label>
                    <textarea id="description" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="خامه قطن جوده عاليه..."></textarea>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg">
                    إضافة العرض للمتجر
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oahyrrymmaazzskpfqvl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9haHlycnltbWFhenpza3BmcXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzg2NTIsImV4cCI6MjEwODk1NDY1Mn0.qUXnhCROVGpx2P-XDFM2nC5xxtKtx86GxW2eV9Ipd3E';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_PASSWORD = 'Al Ostora store 123';

        let allOrders = [];
        let currentFilter = 'الكل';

        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === ADMIN_PASSWORD) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadOrders();
                loadDeliveryZonesAdmin();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function logout() {
            document.getElementById('admin-content').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        }

        function switchTab(tabName) {
            document.getElementById('tab-orders').classList.add('hidden');
            document.getElementById('tab-delivery').classList.add('hidden');
            document.getElementById('tab-offers').classList.add('hidden');
            
            document.getElementById('tab-orders-btn').className = 'py-3 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-xs text-center';
            document.getElementById('tab-delivery-btn').className = 'py-3 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-xs text-center';
            document.getElementById('tab-offers-btn').className = 'py-3 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-xs text-center';

            if(tabName === 'orders') {
                document.getElementById('tab-orders').classList.remove('hidden');
                document.getElementById('tab-orders-btn').className = 'py-3 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg text-center';
            } else if(tabName === 'delivery') {
                document.getElementById('tab-delivery').classList.remove('hidden');
                document.getElementById('tab-delivery-btn').className = 'py-3 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg text-center';
                loadDeliveryZonesAdmin();
            } else if(tabName === 'offers') {
                document.getElementById('tab-offers').classList.remove('hidden');
                document.getElementById('tab-offers-btn').className = 'py-3 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg text-center';
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-list');
            const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            
            if(error) {
                container.innerHTML = '<p class="text-center text-red-500 py-6 text-xs">خطأ في جلب الطلبات</p>';
                return;
            }

            allOrders = data || [];
            document.getElementById('orders-count-badge').innerText = allOrders.filter(o => o.status === 'جديدة').length;
            renderOrders();
        }

        function filterOrders(status) {
            currentFilter = status;
            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('orders-list');
            let filtered = allOrders;
            if(currentFilter !== 'الكل') {
                filtered = allOrders.filter(o => o.status === currentFilter);
            }

            if(filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10 text-xs">لا توجد طلبات حالياً</p>';
                return;
            }

            container.innerHTML = '';
            filtered.forEach((order, index) => {
                const dateObj = new Date(order.created_at);
                const timeStr = dateObj.toLocaleDateString('ar-SA') + '، ' + dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
                
                const card = document.createElement('div');
                card.className = 'bg-[#141414] border border-gray-800 rounded-2xl p-4 text-xs space-y-3 shadow-xl';
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <span class="font-bold gold-text">طلب #${allOrders.length - index}</span>
                        <span class="text-gray-400 text-[10px]">${timeStr}</span>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${order.status === 'جديدة' ? 'bg-amber-900/40 gold-text border gold-border' : 'bg-green-950/40 text-green-400 border border-green-800'}">${order.status}</span>
                    </div>

                    <div class="bg-[#1a1a1a] p-2.5 rounded-xl border border-gray-800">
                        <p class="font-bold text-sm mb-1">${order.product_title}</p>
                        <p class="text-gray-400">المقاس: ${order.size} | اللون: ${order.color}</p>
                    </div>

                    <div class="space-y-1.5 text-gray-300">
                        <div class="flex justify-between"><span class="text-gray-500">الاسم</span><span class="font-bold">${order.customer_name}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">واتساب</span><a href="https://wa.me/${order.customer_whatsapp}" target="_blank" class="gold-text underline font-bold">${order.customer_whatsapp}</a></div>
                        <div class="flex justify-between"><span class="text-gray-500">احتياطي</span><span>${order.alternative_phone}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">المستلم البديل</span><span>${order.alternative_receiver}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">المنطقة</span><span>${order.city} - ${order.area}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">التوصيل</span><span>${order.delivery_price ? order.delivery_price.toLocaleString() + ' ج.س' : 'مجاني'}</span></div>
                        <div class="flex justify-between border-t border-gray-800 pt-1 font-extrabold text-sm gold-text"><span>الإجمالي</span><span>${order.total_price.toLocaleString()} ج.س</span></div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-gray-800">
                        <button onclick="updateOrderStatus('${order.id}', '${order.status === 'جديدة' ? 'مسلمة' : 'جديدة'}')" class="py-2 rounded-xl bg-green-950/40 text-green-400 border border-green-800 font-bold hover:bg-green-900/40 transition">
                            ${order.status === 'جديدة' ? 'تم التسليم' : 'إعادة كجديدة'}
                        </button>
                        <a href="https://wa.me/${order.customer_whatsapp}?text=${encodeURIComponent('مرحباً بك يا ' + order.customer_name + '، بخصوص طلبك من متجر الأسطورة:')}" target="_blank" class="py-2 rounded-xl bg-[#222] text-gray-300 border border-gray-700 font-bold text-center hover:gold-text transition">
                            واتساب العميل
                        </a>
                        <button onclick="deleteOrder('${order.id}')" class="py-2 rounded-xl bg-red-950/40 text-red-400 border border-red-900 font-bold hover:bg-red-900/40 transition">
                            حذف
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadDeliveryZonesAdmin() {
            const container = document.getElementById('delivery-zones-list');
            const { data, error } = await supabaseClient.from('delivery_zones').select('*');
            if(error || !data || data.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-2">لا توجد خيارات توصيل مضافة</p>';
                return;
            }
            container.innerHTML = '';
            data.forEach(zone => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-[#1a1a1a] p-3 rounded-xl border border-gray-800';
                item.innerHTML = `
                    <div>
                        <span class="font-bold">${zone.zone_name}</span>
                        <span class="gold-text mr-2 font-bold">${zone.price.toLocaleString()} ج.س</span>
                    </div>
                    <button onclick="deleteDeliveryZone('${zone.id}')" class="text-red-400 hover:text-red-300 font-bold text-xs px-2 py-1 bg-red-950/30 border border-red-900 rounded-lg">حذف</button>
                `;
                container.appendChild(item);
            });
        }

        async function addDeliveryZone(e) {
            e.preventDefault();
            const zone_name = document.getElementById('zone-name').value.trim();
            const price = parseFloat(document.getElementById('zone-price').value);

            const { error } = await supabaseClient.from('delivery_zones').insert([{ zone_name, price }]);
            if(error) {
                alert('خطأ أثناء إضافة خيار التوصيل');
            } else {
                alert('تمت الإضافة بنجاح!');
                document.getElementById('zone-name').value = '';
                document.getElementById('zone-price').value = '';
                loadDeliveryZonesAdmin();
            }
        }

        async function deleteDeliveryZone(id) {
            if(confirm('هل أنت متأكد من حذف خيار التوصيل هذا؟')) {
                const { error } = await supabaseClient.from('delivery_zones').delete().eq('id', id);
                if(error) alert('خطأ في الحذف');
                else loadDeliveryZonesAdmin();
            }
        }

        async function updateOrderStatus(id, newStatus) {
            const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', id);
            if(error) alert('حدث خطأ أثناء التحديث');
            else loadOrders();
        }

        async function deleteOrder(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                const { error } = await supabaseClient.from('orders').delete().eq('id', id);
                if(error) alert('خطأ في الحذف');
                else loadOrders();
            }
        }

        async function deleteDeliveredOrders() {
            if(confirm('حذف جميع الطلبات المسلمة؟')) {
                const { error } = await supabaseClient.from('orders').delete().eq('status', 'مسلمة');
                if(error) alert('خطأ');
                else loadOrders();
