<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الأسطورة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0b0b; color: #fff; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center pb-12">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="w-full max-w-sm bg-[#141414] border gold-border rounded-2xl p-6 shadow-2xl text-center mt-20">
        <h1 class="text-xl font-bold gold-text mb-2">لوحة تحكم المالك</h1>
        <p class="text-xs text-gray-400 mb-6">الرجاء إدخال كلمة المرور للمتابعة</p>
        <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-3 text-sm mb-4 text-center gold-border focus:outline-none">
        <button onclick="checkPassword()" class="w-full py-3 rounded-xl gold-gradient text-black font-extrabold text-sm shadow-lg mb-3">تسجيل الدخول</button>
        <a href="index.html" class="text-xs text-gray-500 hover:gold-text underline">← العودة للمتجر الرئيسي</a>
    </div>

    <!-- المحتوى الرئيسي للوحة التحكم -->
    <div id="admin-content" class="w-full max-w-md hidden">
        <div class="flex justify-between items-center mb-4 bg-[#141414] p-3 rounded-2xl border gold-border">
            <h1 class="text-base font-bold gold-text">لوحة التحكم</h1>
            <div class="flex items-center gap-2">
                <a href="index.html" class="bg-[#222] px-3 py-1.5 rounded-xl text-xs border border-gray-700 font-bold hover:gold-text">المتجر</a>
                <button onclick="logout()" class="bg-red-950/40 text-red-400 px-3 py-1.5 rounded-xl text-xs border border-red-900 font-bold">خروج</button>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="grid grid-cols-4 gap-1.5 mb-4 text-center">
            <button onclick="switchTab('orders')" id="tab-orders-btn" class="py-2.5 rounded-xl gold-gradient text-black font-extrabold text-[11px] shadow-lg">الطلبات <span id="orders-count-badge" class="bg-black text-white px-1 py-0.5 rounded-full text-[9px]">0</span></button>
            <button onclick="switchTab('cities')" id="tab-cities-btn" class="py-2.5 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-[11px]">المدن</button>
            <button onclick="switchTab('delivery')" id="tab-delivery-btn" class="py-2.5 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-[11px]">التوصيل</button>
            <button onclick="switchTab('offers')" id="tab-offers-btn" class="py-2.5 rounded-xl bg-[#141414] border border-gray-800 text-gray-300 font-bold text-[11px]">العروض</button>
        </div>

        <!-- قسم الطلبات -->
        <div id="tab-orders" class="space-y-4">
            <div class="flex gap-1 overflow-x-auto pb-2">
                <button onclick="filterOrders('الكل')" class="filter-btn bg-[#222] px-3 py-1.5 rounded-xl text-xs border gold-border font-bold">الكل</button>
                <button onclick="filterOrders('جديدة')" class="filter-btn bg-[#141414] px-3 py-1.5 rounded-xl text-xs border border-gray-800 text-gray-400">جديدة</button>
                <button onclick="filterOrders('مسلمة')" class="filter-btn bg-[#141414] px-3 py-1.5 rounded-xl text-xs border border-gray-800 text-gray-400">مسلمة</button>
                <button onclick="loadOrders()" class="bg-[#141414] px-3 py-1.5 rounded-xl text-xs border border-gray-800 text-gray-400 mr-auto">تحديث</button>
            </div>

            <div class="flex justify-between items-center text-xs">
                <button onclick="deleteDeliveredOrders()" class="text-red-400 hover:underline">حذف المسلمة</button>
                <button onclick="deleteAllOrders()" class="text-red-500 hover:underline">إفراغ كل الطلبات</button>
            </div>

            <div id="orders-list" class="space-y-4">
                <p class="text-center text-gray-500 py-10 text-xs">جاري تحميل الطلبات...</p>
            </div>
        </div>

        <!-- قسم إدارة المدن -->
        <div id="tab-cities" class="bg-[#141414] border gold-border rounded-2xl p-4 hidden space-y-4 text-xs">
            <h3 class="font-bold gold-text text-sm mb-1">إضافة وإدارة مدن التوصيل</h3>
            
            <form onsubmit="addCity(event)" class="space-y-2.5 bg-[#1a1a1a] p-3 rounded-xl border border-gray-800 mb-4">
                <div>
                    <label class="block text-gray-400 mb-1">اسم المدينة الجديدة</label>
                    <input type="text" id="new-city-name" required class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="مثال: بورتسودان">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg">إضافة المدينة للمتجر 🏙️</button>
            </form>

            <div id="admin-cities-list" class="space-y-2">
                <p class="text-center text-gray-500 py-4">جاري التحميل...</p>
            </div>
        </div>

        <!-- قسم إدارة التوصيل -->
        <div id="tab-delivery" class="bg-[#141414] border gold-border rounded-2xl p-4 hidden space-y-4 text-xs">
            <h3 class="font-bold gold-text text-sm mb-1">إدارة أسعار وطرق التوصيل</h3>
            
            <form onsubmit="addDeliveryZone(event)" class="space-y-2.5 bg-[#1a1a1a] p-3 rounded-xl border border-gray-800 mb-4">
                <div>
                    <label class="block text-gray-400 mb-1">اسم خيار التوصيل</label>
                    <input type="text" id="zone-name" required class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="مثال: توصيل خاص">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">السعر (ج.س)</label>
                    <input type="number" id="zone-price" required class="w-full bg-[#121212] border border-gray-700 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="6000">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg">إضافة خيار التوصيل</button>
            </form>

            <div id="delivery-zones-list" class="space-y-2">
                <p class="text-center text-gray-500 py-4">جاري التحميل...</p>
            </div>
        </div>

        <!-- قسم العروض -->
        <div id="tab-offers" class="bg-[#141414] border gold-border rounded-2xl p-4 hidden space-y-5 text-xs">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h3 id="form-title" class="font-bold gold-text text-sm">إضافة عرض أو منتج جديد</h3>
                    <button type="button" id="cancel-edit-btn" onclick="resetProductForm()" class="hidden text-gray-400 hover:text-white underline text-[10px]">إلغاء التعديل</button>
                </div>
                <form id="product-form" onsubmit="saveProduct(event)" class="space-y-3">
                    <div>
                        <label class="block text-gray-400 mb-1">اسم العرض / المنتج</label>
                        <input type="text" id="title" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="مثال: طقم رياضي فاخر">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">السعر (ج.س)</label>
                        <input type="number" id="price" required class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="60000">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">المدينة المخصصة للعرض</label>
                        <select id="product-city" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none">
                            <option value="الكل">كل المدن</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">ألوان العرض المتاحة (افصل بينها بفاصلة)</label>
                        <input type="text" id="product-colors" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="أسود، كبدي، أزرق، أبيض">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">صورة العرض (من المعرض)</label>
                        <input type="file" id="product-image-file" accept="image/*" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2 text-xs gold-border focus:outline-none file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#d4af37] file:text-black hover:file:opacity-90">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">وصف العرض</label>
                        <textarea id="description" class="w-full bg-[#1a1a1a] border border-gray-800 rounded-xl p-2.5 text-xs gold-border focus:outline-none" placeholder="خامه قطن جوده عاليه..."></textarea>
                    </div>
                    <button type="submit" id="product-submit-btn" class="w-full py-3 rounded-xl gold-gradient text-black font-extrabold text-xs shadow-lg">
                        إضافة العرض للمتجر
                    </button>
                </form>
            </div>

            <div class="border-t border-gray-800 pt-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold gold-text text-sm">عروض المدن الحالية</h3>
                    <select id="filter-admin-city" onchange="loadAdminProducts()" class="bg-[#1a1a1a] border border-gray-700 rounded-lg p-1 text-[11px] gold-border focus:outline-none">
                        <option value="الكل">جميع المدن</option>
                    </select>
                </div>
                <div id="admin-products-list" class="space-y-3">
                    <p class="text-center text-gray-500 py-4">جاري تحميل العروض...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oahyrrymmaazzskpfqvl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9haHlycnltbWFhenpza3BmcXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzg2NTIsImV4cCI6MjEwODk1NDY1Mn0.qUXnhCROVGpx2P-XDFM2nC5xxtKtx86GxW2eV9Ipd3E';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_PASSWORD = 'OS 123';

        let allOrders = [];
        let currentFilter = 'الكل';
        let editingProductId = null;

        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === ADMIN_PASSWORD) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadOrders();
                loadDeliveryZonesAdmin();
                loadCitiesAdmin();
                loadProductCityOptions();
                loadAdminProducts();
            } else {
                alert('كلمة المرور غير صحيحة!');
document.getElementById('form-title').innerText = 'تعديل العرض أو المنتج';
            document.getElementById('product-submit-btn').innerText = 'حفظ تعديلات العرض ✏️';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            document.getElementById('product-form').scrollIntoView({ behavior: 'smooth' });
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            editingProductId = null;
            document.getElementById('form-title').innerText = 'إضافة عرض أو منتج جديد';
            document.getElementById('product-submit-btn').innerText = 'إضافة العرض للمتجر';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const price = parseFloat(document.getElementById('price').value);
            const city = document.getElementById('product-city').value;
            const colors = document.getElementById('product-colors').value.trim() || 'أسود، كبدي، أزرق';
            const description = document.getElementById('description').value;
            const fileInput = document.getElementById('product-image-file');

            const executeSave = async (image_url) => {
                let error;
                if(editingProductId) {
                    const updateData = { title, price, city, colors, description };
                    if(image_url) updateData.image_url = image_url;
                    const res = await supabaseClient.from('products').update(updateData).eq('id', editingProductId);
                    error = res.error;
                } else {
                    if (!image_url) {
                        alert('الرجاء اختيار صورة العرض من المعرض');
                        return;
                    }
                    const res = await supabaseClient.from('products').insert([{ title, price, city, colors, image_url, description }]);
                    error = res.error;
                }

                if(error) {
                    alert("حدث خطأ: " + error.message);
                } else {
                    alert(editingProductId ? "تم تحديث العرض بنجاح!" : "تم إضافة العرض بنجاح!");
                    resetProductForm();
                    loadAdminProducts();
                }
            };

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    executeSave(uploadEvent.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                executeSave(null);
            }
        }

        async function deleteProduct(id) {
            if(confirm('هل أنت متأكد من حذف هذا العرض نهائياً من المتجر؟')) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if(error) {
                    alert('خطأ أثناء الحذف: ' + error.message);
                } else {
                    alert('تم حذف العرض بنجاح!');
                    loadAdminProducts();
                }
            }
        }

        async function updateOrderStatus(id, newStatus) {
            const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', id);
            if(error) alert('حدث خطأ أثناء التحديث');
            else loadOrders();
        }

        async function deleteOrder(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                const { error } = await supabaseClient.from('orders').delete().eq('id', id);
                if(error) alert('خطأ في الحذف');
                else loadOrders();
            }
        }

        async function deleteDeliveredOrders() {
            if(confirm('حذف جميع الطلبات المسلمة؟')) {
                const { error } = await supabaseClient.from('orders').delete().eq('status', 'مسلمة');
                if(error) alert('خطأ');
                else loadOrders();
            }
        }

        async function deleteAllOrders() {
            if(confirm('تحذير: سيتم حذف جميع الطلبات بالكامل! هل أنت متأكد؟')) {
                const { error } = await supabaseClient.from('orders').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if(error) alert('خطأ');
                else loadOrders();
            }
        }
    </script>
</body>
</html>
